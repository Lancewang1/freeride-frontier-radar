name: Collect public signals (manual)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refresh_landscape.py
      - uses: actions/upload-artifact@v4
        with:
          name: pending-research
          path: private/landscape-pending.json
